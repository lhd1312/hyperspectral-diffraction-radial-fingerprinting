name: Source and CPU smoke tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      YOLO_CONFIG_DIR: ${{ github.workspace }}/.cache/ultralytics
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: python -m pip install torch==2.10.0 torchvision==0.25.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_release.py
      - run: python -m pytest -q
      - run: python tools/smoke_augmentation.py
